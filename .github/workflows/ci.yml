name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      # 全部测试走 tests/fixtures 的离线快照，不联网、不需要任何 Secret
      - run: pytest -q

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 事实库与运行时产物不得入库
        run: |
          # 合规红线写进 CI 比写进文档可靠：tin.db 里有人工录入的 SMM / LME 授权数据，
          # 一旦提交到 GitHub 就等于外发（PRD 00 §7.1）。
          bad=$(git ls-files | grep -E '\.db$|^data/|^exports/|^raw/' || true)
          if [ -n "$bad" ]; then
            echo "以下文件不应进入版本库："; echo "$bad"; exit 1
          fi
          echo "未发现事实库或运行时产物"
